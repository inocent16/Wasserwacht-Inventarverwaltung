name: Supabase Database

on:
  push:
    paths:
      - "supabase/**"
      - ".github/workflows/database.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/database.yml"

concurrency:
  group: supabase-database-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase stack and apply migrations
        run: CI=false supabase start

      - name: Run PostgreSQL / pgTAP tests
        run: supabase test db

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
