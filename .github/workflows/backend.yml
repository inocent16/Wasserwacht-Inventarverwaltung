name: Backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: wasserwacht_inventory
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d wasserwacht_inventory"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore backend/tests/Wasserwacht.Api.Tests/Wasserwacht.Api.Tests.csproj
      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.15
      - name: Validate migration model snapshot
        env:
          WASSERWACHT_DB: Host=localhost;Database=wasserwacht_inventory;Username=ci;Password=ci
        run: dotnet ef migrations has-pending-model-changes --project backend/src/Wasserwacht.Api/Wasserwacht.Api.csproj --startup-project backend/src/Wasserwacht.Api/Wasserwacht.Api.csproj
      - name: Build
        run: dotnet build backend/src/Wasserwacht.Api/Wasserwacht.Api.csproj --no-restore --configuration Release
      - name: Test
        env:
          WASSERWACHT_DB: Host=localhost;Port=5432;Database=wasserwacht_inventory;Username=ci;Password=ci
        run: dotnet test backend/tests/Wasserwacht.Api.Tests/Wasserwacht.Api.Tests.csproj --no-restore --configuration Release
