name: Backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore backend/tests/Wasserwacht.Api.Tests/Wasserwacht.Api.Tests.csproj
      - name: Build
        run: dotnet build backend/src/Wasserwacht.Api/Wasserwacht.Api.csproj --no-restore --configuration Release
      - name: Test
        run: dotnet test backend/tests/Wasserwacht.Api.Tests/Wasserwacht.Api.Tests.csproj --no-restore --configuration Release
